    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

<script>
const vehicleForm = document.getElementById('vehicleForm');

vehicleForm.addEventListener('submit', async function (e) {
  e.preventDefault();

  const response = await fetch(vehicleForm.action, {
    method: vehicleForm.method,
    body: new FormData(vehicleForm),
    headers: { 'Accept': 'application/json' }
  });

  if (response.ok) {
    // Clear saved form data
    localStorage.clear();

    // Redirect to thank-you page
    window.location.href = '/gracias.html';
  } else {
    alert('Hubo un error al enviar el formulario. Inténtalo de nuevo.');
  }
});
</script>

    <script>
        // Preserve form data after refresh and errors
        const form = document.querySelector('form');
        const fields = form.querySelectorAll('input, select');

        // Load saved values
        fields.forEach(field => {
            const saved = localStorage.getItem(field.id);
            if (saved) field.value = saved;
        });

        // Save on input or change
        fields.forEach(field => {
            ['input', 'change'].forEach(evt => {
                field.addEventListener(evt, () => {
                    localStorage.setItem(field.id, field.value);
                });
            });
        });(field => {
            const saved = localStorage.getItem(field.name);
            if (saved) field.value = saved;
        });

        // Save on change
        fields.forEach(field => {
            field.addEventListener('change', () => {
                localStorage.setItem(field.name, field.value);
            });
        });
    </script>
